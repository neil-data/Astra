services:
  - type: web
    name: astra-backend
    runtime: docker
    dockerfilePath: ./astra-backend/Dockerfile
    dockerContext: ./astra-backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: astra-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: astra-data-pipeline
    runtime: docker
    dockerfilePath: ./data_pipeline/Dockerfile
    dockerContext: ./data_pipeline
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: astra-redis
          type: redis
          property: connectionString
      - key: NASA_API_KEY
        sync: false

  - type: redis
    name: astra-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: astra-db
    plan: free
    region: singapore
    databaseName: astra_db
    user: astra_user
