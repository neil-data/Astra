version: "3.9"

networks:
  astra_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: astra_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: astra_db
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: astra_pass
    networks:
      - astra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_user -d astra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: astra_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astra_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: ./astra-backend
    container_name: astra_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://astra_user:astra_pass@postgres:5432/astra_db
      REDIS_URL: redis://redis:6379
      ENV: development
      JWT_SECRET_KEY: astra-super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./astra-backend:/app
    networks:
      - astra_net

  data_pipeline:
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile
    container_name: astra_data_pipeline
    restart: on-failure
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - astra_net
