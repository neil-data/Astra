<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ASTRA — Advanced Space Terrain and Radiation Analytics">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#0D1226"/>
      <stop offset="100%" stop-color="#141B33"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3A3"/>
      <stop offset="45%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2340"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="flux" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FD1E8" stop-offset="0"/>
      <stop offset="8%" stop-color="#4FD1E8"/>
      <stop offset="92%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r="1" fill="#E8ECF4" opacity="0.35"/>
      <circle cx="46" cy="60" r="1.3" fill="#E8ECF4" opacity="0.25"/>
      <circle cx="92" cy="22" r="0.9" fill="#E8ECF4" opacity="0.4"/>
      <circle cx="70" cy="96" r="1.1" fill="#E8ECF4" opacity="0.3"/>
      <circle cx="20" cy="88" r="0.8" fill="#E8ECF4" opacity="0.3"/>
      <circle cx="108" cy="70" r="1.2" fill="#E8ECF4" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#stars)"/>

  <!-- sun / flare source, upper right -->
  <circle cx="1080" cy="46" r="90" fill="url(#sun)"/>
  <circle cx="1080" cy="46" r="10" fill="#FFE3A3"/>

  <!-- planet limb / terrain horizon, bottom -->
  <path d="M -20 280 L -20 210 Q 300 150 600 190 T 1220 175 L 1220 280 Z" fill="url(#horizon)" stroke="#4FD1E8" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- concentric radiation rings around a monitored point on the horizon -->
  <g transform="translate(210,196)" opacity="0.55">
    <circle r="14" fill="none" stroke="#F5A623" stroke-width="1.4"/>
    <circle r="26" fill="none" stroke="#F5A623" stroke-width="1" opacity="0.7"/>
    <circle r="38" fill="none" stroke="#F5A623" stroke-width="0.8" opacity="0.45"/>
  </g>

  <!-- satellite orbit arc -->
  <path d="M 60 90 Q 400 -10 760 60" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.6"/>
  <g transform="translate(760,60)" filter="url(#glow)">
    <circle r="4" fill="#34D399"/>
    <rect x="-11" y="-2.5" width="6" height="5" fill="#34D399" opacity="0.85"/>
    <rect x="5" y="-2.5" width="6" height="5" fill="#34D399" opacity="0.85"/>
  </g>

  <!-- particle-flux trace, spanning the width like a telemetry read-out -->
  <path d="M 40 236 L 130 236 L 150 220 L 168 244 L 190 200 L 210 236 L 900 236 L 918 214 L 934 250 L 952 196 L 970 236 L 1160 236"
        fill="none" stroke="url(#flux)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="60" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="10" fill="#E8ECF4">ASTRA</text>
  <text x="66" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="10" fill="none" stroke="#4FD1E8" stroke-width="0.6" opacity="0.5">ASTRA</text>

  <!-- subtitle / eyebrow -->
  <text x="63" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="3" fill="#9AA5C7">ADVANCED SPACE TERRAIN &amp; RADIATION ANALYTICS</text>

  <!-- baseline rule -->
  <line x1="63" y1="172" x2="520" y2="172" stroke="#4FD1E8" stroke-width="1.5" opacity="0.6"/>
</svg>
