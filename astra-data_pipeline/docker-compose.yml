version: "3.9"

networks:
  astra_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: astra_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_secret
    networks:
      - astra_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: astra_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astra_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  data_pipeline:
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile
    container_name: astra_data_pipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - astra_net
    restart: on-failure